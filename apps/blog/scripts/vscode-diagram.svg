<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" style="background:#1e1e1e; font-family: 'Segoe UI', sans-serif;">
  <!-- 0. Menu Bar (Top) -->
  <rect x="0" y="0" width="800" height="30" fill="#333333" />
  <text x="15" y="20" fill="#cccccc" font-size="12">文件(F)</text>
  <text x="65" y="20" fill="#cccccc" font-size="12">编辑(E)</text>
  <text x="115" y="20" fill="#cccccc" font-size="12">选择(S)</text>
  <text x="165" y="20" fill="#cccccc" font-size="12">查看(V)</text>
  <text x="215" y="20" fill="#cccccc" font-size="12">转到(G)</text>
  <text x="265" y="20" fill="#cccccc" font-size="12">...</text>
  <text x="400" y="20" fill="#999" font-size="12" text-anchor="middle">VS Code - 入门指南</text>
  <circle cx="780" cy="15" r="5" fill="#d9534f" />
  <circle cx="760" cy="15" r="5" fill="#f0ad4e" />
  <circle cx="740" cy="15" r="5" fill="#5cb85c" />

  <!-- 1. Activity Bar (Left Strip) -->
  <rect x="0" y="30" width="50" height="500" fill="#333333" />
  <rect x="15" y="45" width="20" height="20" fill="#fff" opacity="0.9" />
  <circle cx="25" cy="95" r="8" stroke="#777" stroke-width="2" fill="none" />
  <line x1="30" y1="100" x2="36" y2="106" stroke="#777" stroke-width="2" />
  <circle cx="22" cy="135" r="3" fill="#777" />
  <circle cx="28" cy="145" r="3" fill="#777" />
  <line x1="22" y1="135" x2="22" y2="155" stroke="#777" stroke-width="2" />
  <line x1="22" y1="145" x2="28" y2="145" stroke="#777" stroke-width="2" />
  <polygon points="20,180 20,195 32,187" fill="#777" />
  <rect x="16" y="220" width="8" height="8" fill="#777" />
  <rect x="26" y="220" width="8" height="8" fill="#777" />
  <rect x="16" y="230" width="8" height="8" fill="#777" />
  <rect x="26" y="230" width="8" height="8" fill="#777" opacity="0.5" />

  <!-- 2. Side Bar (Tree View) -->
  <rect x="50" y="30" width="180" height="500" fill="#252526" />
  <text x="65" y="55" fill="#bbbbbb" font-size="11" font-weight="bold">资源管理器</text>
  <polygon points="65,75 75,75 70,80" fill="#ccc" />
  <text x="80" y="80" fill="#fff" font-size="12" font-weight="bold">MY-PROJECT</text>
  <text x="90" y="105" fill="#ccc" font-size="12">src</text>
  <rect x="85" y="115" width="145" height="20" fill="#37373d" />
  <text x="105" y="130" fill="#fff" font-size="12">index.js</text>
  <text x="105" y="155" fill="#ccc" font-size="12">style.css</text>
  <text x="90" y="180" fill="#ccc" font-size="12">package.json</text>
  <text x="90" y="205" fill="#ccc" font-size="12">README.md</text>

  <!-- 3. Editor (Main Area) -->
  <rect x="230" y="30" width="570" height="370" fill="#1e1e1e" />
  <rect x="230" y="30" width="570" height="35" fill="#252526" />
  <rect x="230" y="30" width="120" height="35" fill="#1e1e1e" />
  <text x="245" y="52" fill="#e8e8e8" font-size="13">JS index.js ×</text>
  <text x="365" y="52" fill="#888" font-size="13"># style.css</text>
  <text x="250" y="90" fill="#569cd6" font-size="14" font-family="monospace">const</text>
  <text x="300" y="90" fill="#4fc1ff" font-size="14" font-family="monospace">welcome</text>
  <text x="365" y="90" fill="#d4d4d4" font-size="14" font-family="monospace">= () => {</text>
  <text x="270" y="120" fill="#6a9955" font-size="14" font-family="monospace">// 这是你的主要工作区</text>
  <text x="270" y="145" fill="#9cdcfe" font-size="14" font-family="monospace">console</text>
  <text x="325" y="145" fill="#d4d4d4" font-size="14" font-family="monospace">.</text>
  <text x="335" y="145" fill="#dcdcaa" font-size="14" font-family="monospace">log</text>
  <text x="360" y="145" fill="#ce9178" font-size="14" font-family="monospace">("Hello, VS Code!")</text>
  <text x="515" y="145" fill="#d4d4d4" font-size="14" font-family="monospace">;</text>
  <text x="270" y="175" fill="#c586c0" font-size="14" font-family="monospace">return</text>
  <text x="325" y="175" fill="#b5cea8" font-size="14" font-family="monospace">true</text>
  <text x="360" y="175" fill="#d4d4d4" font-size="14" font-family="monospace">;</text>
  <text x="250" y="205" fill="#d4d4d4" font-size="14" font-family="monospace">}</text>
  <rect x="525" y="130" width="2" height="18" fill="#fff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>

  <!-- 4. Panel (Bottom Terminal) -->
  <rect x="230" y="400" width="570" height="130" fill="#1e1e1e" stroke="#333" stroke-width="1" />
  <line x1="230" y1="400" x2="800" y2="400" stroke="#444" stroke-width="2"/>
  <text x="245" y="425" fill="#888" font-size="11">问题</text>
  <text x="290" y="425" fill="#888" font-size="11">输出</text>
  <text x="335" y="425" fill="#888" font-size="11">调试控制台</text>
  <text x="410" y="425" fill="#fff" font-size="11" text-decoration="underline">终端</text>
  <text x="245" y="455" fill="#4caf50" font-size="12" font-family="monospace">user@project</text>
  <text x="330" y="455" fill="#fff" font-size="12" font-family="monospace">MINGW64 /c/code</text>
  <text x="245" y="475" fill="#fff" font-size="12" font-family="monospace">$ npm install</text>
  <text x="245" y="495" fill="#ccc" font-size="12" font-family="monospace">added 5 packages in 2s...</text>

  <!-- 5. Status Bar (Very Bottom) -->
  <rect x="0" y="530" width="800" height="20" fill="#007acc" />
  <text x="15" y="544" fill="#fff" font-size="10">main*</text>
  <text x="50" y="544" fill="#fff" font-size="10">0 errors</text>
  <text x="650" y="544" fill="#fff" font-size="10">行 5, 列 32</text>
  <text x="720" y="544" fill="#fff" font-size="10">UTF-8</text>
  <text x="760" y="544" fill="#fff" font-size="10">JavaScript</text>

  <!-- ANNOTATION BADGES -->
  <circle cx="400" cy="15" r="10" fill="#ff0000" stroke="#fff" stroke-width="2"/>
  <text x="400" y="19" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">0</text>
  <circle cx="25" cy="270" r="10" fill="#ff0000" stroke="#fff" stroke-width="2"/>
  <text x="25" y="274" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
  <circle cx="140" cy="250" r="10" fill="#ff0000" stroke="#fff" stroke-width="2"/>
  <text x="140" y="254" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
  <circle cx="515" cy="200" r="10" fill="#ff0000" stroke="#fff" stroke-width="2"/>
  <text x="515" y="204" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
  <circle cx="515" cy="460" r="10" fill="#ff0000" stroke="#fff" stroke-width="2"/>
  <text x="515" y="464" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">4</text>
  <circle cx="400" cy="540" r="10" fill="#ff0000" stroke="#fff" stroke-width="2"/>
  <text x="400" y="544" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">5</text>
</svg>
