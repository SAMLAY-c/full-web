[build]
  # 基础目录
  base = "."
  
  # 构建命令 - 先安装依赖，然后构建 blog 应用
  command = "pnpm install && cd apps/blog && pnpm build"
  
  # 发布目录 - Next.js 构建输出
  publish = "apps/blog/.next"

[build.environment]
  # Node.js 版本
  NODE_VERSION = "20"
  
  # pnpm 版本
  NPM_FLAGS = "--version"
  
  # 禁用 Next.js 遥测
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js on Netlify 插件
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 缓存控制 - 静态资源
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 安全头
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
